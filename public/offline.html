<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070a12" />
    <title>Loïc Marathon 2:55 Offline</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070a12;
        color: #f8fafc;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        max-width: 420px;
        padding: 28px;
        background: rgba(15, 23, 42, 0.86);
        box-shadow: 0 30px 90px rgba(0, 0, 0, 0.35);
      }

      .logo {
        align-items: center;
        background: linear-gradient(135deg, #67e8f9, #2563eb);
        border-radius: 999px;
        color: #020617;
        display: flex;
        font-weight: 800;
        height: 56px;
        justify-content: center;
        width: 56px;
      }

      h1 {
        font-size: 24px;
        margin: 20px 0 8px;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">2:55</div>
      <h1>Offline mode</h1>
      <p>
        Loïc Marathon 2:55 is installed for offline use. Reopen the app once your connection is
        back if this page appears instead of the training dashboard.
      </p>
    </main>
  </body>
</html>
