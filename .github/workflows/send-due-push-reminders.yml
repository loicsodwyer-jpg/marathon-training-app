name: Send due push reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-due:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder scheduler
        run: |
          curl --fail-with-body --request POST "${{ secrets.PUSH_CRON_URL }}" \
            --header "Authorization: Bearer ${{ secrets.PUSH_CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            --data '{"dryRun":false,"limit":50}'
